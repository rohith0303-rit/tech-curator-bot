name: Daily News Curator & Emailer

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'

jobs:
  run-curator:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser reportlab google-genai

    - name: Run news curator script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      run: python curator_pdf.py
