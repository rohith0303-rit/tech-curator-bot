name: Daily News Curator & Emailer

on:
  schedule:
    - cron: '30 1 * * *' # Runs every day at 7:00 AM IST (UTC 1:30)
  workflow_dispatch: # Allows you to test it manually anytime

jobs:
  run-curator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser reportlab

      - name: Run Curator Script
        run: |
          python curator.py
